[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "ahead-of-the-storm-workspace"
version = "0.1.0"
description = "Shared uv-managed Python environment for Ahead of the Storm submodules."
requires-python = ">=3.11,<3.13"
dependencies = [
    "azure-storage-blob>=12.0.0",
    "brotli>=1.0.9",
    "cfgrib>=0.9.10",
    "contextily>=1.4.0",
    "cryptography>=41.0.0",
    "dash>=4.1.0",
    "dash-extensions>=1.0.0",
    "dash-iconify>=0.1.2",
    "dash-leaflet>=0.2.0",
    "dash-mantine-components>=2.7.0",
    "eccodes>=1.5.0",
    "ecmwf-opendata>=0.0.8",
    "fastapi>=0.111.0",
    "flask>=2.3.0",
    "flask-compress>=1.14",
    "geopandas>=0.13.0",
    "giga-spatial[all]>=0.9.4",
    "gunicorn>=21.2.0",
    "headroom-ai[all]",
    "mapbox-vector-tile>=2.2.0",
    "matplotlib>=3.7.0",
    "mercantile>=1.2.1",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "pillow>=10.0.0",
    "plotly>=5.15.0",
    "psutil>=5.9.0",
    "pydantic>=2.8.0",
    "pycountry>=22.3.5",
    "pyproj>=3.4.0",
    "python-dotenv>=1.0.0",
    "quantulum3[classifier]>=0.1.0",
    "shapely>=2.0.0",
    "snowflake-connector-python[pandas]>=3.10.0",
    "sf-hamilton>=1.89.0",
    "uvicorn[standard]>=0.29.0",
    "xarray>=2023.1.0",
]

[dependency-groups]
dev = [
    "graphviz>=0.21",
    "mypy>=2.3.0",
    "pre-commit>=4.6.1",
    "pytest>=8.0.0",
    "ruff>=0.16.1",
]

[project.scripts]
aots-report = "aots_portable_reports.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aots_portable_reports"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "C901"]
mccabe = { max-complexity = 22 }

[tool.mypy]
python_version = "3.11"
files = [
    "src/aots_portable_reports/alert_contract.py",
    "src/aots_portable_reports/cli.py",
    "src/aots_portable_reports/local_adapter.py",
    "src/aots_portable_reports/models.py",
    "src/aots_portable_reports/publication.py",
]
check_untyped_defs = true
disallow_untyped_defs = false
follow_imports = "skip"
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true

[tool.aots-dependencies]
sources = [
    "Ahead-of-the-Storm-ORCHESTRATION/requirements.txt",
    "Ahead-of-the-Storm-DATAPIPELINE/requirements.txt",
    "TC-ECMWF-Forecast-Pipeline/requirements.txt",
    "TC-ECMWF-Forecast-Pipeline/web/requirements.txt",
    "Ahead-of-the-Storm/requirements.txt",
    "Ahead-of-the-Storm/services/requirements.txt",
]
merge_policy = "Deduplicated requirement names and kept the highest lower-bound version where duplicate constraints appeared."
overrides = [
    "Ahead-of-the-Storm/services/requirements.txt lists mapbox-vector-tile>=5.1.0, but uv reports only mapbox-vector-tile<=2.2.0 is available from the configured package index; this workspace uses >=2.2.0 so the environment can resolve.",
]
