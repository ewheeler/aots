project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - tutorials/*.qmd
    - how-to/*.qmd
    - reference/*.qmd
    - explanation/*.qmd
    - adr/index.qmd
    - adr/*.md
    - project/*.qmd
    - contributor/*.qmd
    - agents/repository-map.md

website:
