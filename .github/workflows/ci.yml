name: CI

on:
  push:
  pull_request:

jobs:
  test-and-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.11

      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Run tests
        run: uv run pytest

      - name: Render docs
        run: quarto render docs
